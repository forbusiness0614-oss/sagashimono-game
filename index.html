<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>さがしものゲーム｜おもちゃの部屋</title><style>*{box-sizing:border-box}body{margin:0;background:#102b48;font-family:system-ui,sans-serif;color:white}.wrap{max-width:1000px;margin:auto;padding:8px}.intro{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 4px;font-size:14px}.intro button,.modal button{border:0;border-radius:20px;background:#ffd44b;color:#28313b;font-weight:800;padding:10px 15px}.frame{position:relative;width:100%;box-shadow:0 8px 30px #0007;line-height:0}.frame img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}.hit{position:absolute;border:0;border-radius:50%;background:transparent;transform:translate(-50%,-50%);cursor:pointer;touch-action:manipulation}.hit.found{border:4px solid #4be3a2;background:#30d99b55;box-shadow:0 0 0 4px #fff9,0 0 22px #2af9b5}.hit.found:after{content:'✓';font-weight:900;font-size:clamp(17px,4vw,38px);color:white;text-shadow:0 2px 5px #084}.hit.hint{border:5px dashed #ffeb2d;animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px #ffed2933}}.toast{position:fixed;left:50%;top:15%;transform:translateX(-50%);background:#132e4be8;border:2px solid #ffe277;border-radius:14px;padding:12px 20px;font-weight:800;z-index:4;pointer-events:none}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#071c31c9;display:flex;justify-content:center;align-items:center;z-index:5;padding:20px}.panel{max-width:400px;width:100%;border:3px solid #e8b44d;background:#fff7df;color:#26394a;text-align:center;border-radius:20px;padding:25px}.panel h2{margin:0 0 12px}.panel p{line-height:1.7}.note{font-size:12px;color:#d7e8f2;text-align:center;padding:8px}button:focus-visible{outline:3px solid #ffcc00}</style></head><body><main class="wrap"><div class="intro"><span id="progress">発見 0 / 10</span><span id="clock">00:00</span><button id="hint">💡 ヒント 残り3回</button><button id="reset">↻</button></div><div class="frame" id="frame"><img src="stage1.png" alt="おもちゃでいっぱいの部屋。下部に探すもの10個の一覧があります" id="scene"></div><div class="note">写真を拡大して探せるよ。見つけたものを直接タップ！</div></main><div class="toast hidden" id="toast"></div><div class="modal" id="modal"><div class="panel"><h2 id="modalTitle">🔍 おもちゃの部屋</h2><p id="modalText">写真の中に隠れた10個のアイテムを見つけよう！<br>見つけたらその場所をタップ。<br>ヒントは3回まで使えるよ。</p><button id="start">ゲーム開始！</button></div></div><script>const items=[['アヒル',724,747,52],['サッカーボール',655,676,65],['りんご',831,793,57],['虫めがね',772,864,65],['ルービックキューブ',424,754,55],['めざまし時計',1080,363,55],['まつぼっくり',300,730,45],['星のかざり',555,124,46],['ひこうき',116,820,85],['きょうりゅう',1085,709,82]];const W=1169,H=1279;let found=new Set(),hints=3,seconds=0,timer=null,started=false,hintIndex=-1,toastTimer;const $=id=>document.getElementById(id),frame=$('frame');items.forEach(([label,x,y,size],i)=>{const b=document.createElement('button');b.className='hit';b.style.left=x/W*100+'%';b.style.top=y/H*100+'%';b.style.width=size/W*100+'%';b.style.height=size/H*100+'%';b.setAttribute('aria-label',label);b.title=label;b.onclick=()=>{if(!started||found.has(i))return;found.add(i);b.classList.add('found');b.classList.remove('hint');$('progress').textContent=`発見 ${found.size} / 10`;flash(`✨ ${label}を発見！`);if(found.size===items.length){clearInterval(timer);started=false;setTimeout(()=>{ $('modalTitle').textContent='🎉 全部みつけた！';$('modalText').textContent=`10個ぜんぶ発見！ クリアタイム ${format(seconds)}！`; $('start').textContent='もう一度あそぶ';$('modal').classList.remove('hidden')},900)}};frame.appendChild(b)});function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function flash(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),1700)}function reset(){found.clear();hints=3;seconds=0;hintIndex=-1;started=true;document.querySelectorAll('.hit').forEach(b=>b.classList.remove('found','hint'));$('progress').textContent='発見 0 / 10';$('clock').textContent='00:00';$('hint').textContent='💡 ヒント 残り3回';$('modal').classList.add('hidden');clearInterval(timer);timer=setInterval(()=>{$('clock').textContent=format(++seconds)},1000)}$('start').onclick=reset;$('reset').onclick=()=>{if(confirm('最初からやり直す？'))reset()};$('hint').onclick=()=>{if(!started||hints<=0)return;const i=items.findIndex((_,j)=>!found.has(j)&&j!==hintIndex);const target=i<0?items.findIndex((_,j)=>!found.has(j)):i;if(target<0)return;document.querySelectorAll('.hit').forEach(b=>b.classList.remove('hint'));frame.querySelectorAll('.hit')[target].classList.add('hint');hintIndex=target;hints--;$('hint').textContent=`💡 ヒント 残り${hints}回`;flash(`${items[target][0]}は黄色い丸の近く！`)};</script></body></html>
